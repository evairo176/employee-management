<div class="mx-auto max-w-3xl space-y-4">
  <header>
    <h1 class="text-lg font-semibold text-foreground">Profil saya</h1>
    <p class="text-[13px] text-muted-foreground">Detail akun yang sedang dipakai untuk masuk.</p>
  </header>

  <section class="rounded-lg border border-border bg-card p-4 sm:p-5">
    <div class="flex items-center gap-4">
      <z-avatar zSize="lg" zSrc="" [zFallback]="initials()" zAlt="Foto profil" />
      <div class="min-w-0">
        <p class="truncate text-sm font-semibold text-foreground">{{ session()?.name }}</p>
        <p class="truncate text-[13px] text-muted-foreground">{{ session()?.email }}</p>
        <div class="mt-1.5">
          <z-badge zType="secondary">{{ session()?.role }}</z-badge>
        </div>
      </div>
    </div>

    <dl class="mt-5 grid gap-3 border-t border-border pt-4 sm:grid-cols-2">
      <div>
        <dt class="text-[11px] font-medium text-muted-foreground">Nama lengkap</dt>
        <dd class="text-[13px] text-foreground">{{ session()?.name }}</dd>
      </div>
      <div>
        <dt class="text-[11px] font-medium text-muted-foreground">Username</dt>
        <dd class="text-[13px] text-foreground">{{ session()?.username }}</dd>
      </div>
      <div>
        <dt class="text-[11px] font-medium text-muted-foreground">Role</dt>
        <dd class="text-[13px] text-foreground">{{ session()?.role }}</dd>
      </div>
      <div>
        <dt class="text-[11px] font-medium text-muted-foreground">Email</dt>
        <dd class="text-[13px] text-foreground">{{ session()?.email }}</dd>
      </div>
    </dl>

    <div class="mt-5 flex justify-end border-t border-border pt-4">
      <button z-button zType="destructive" type="button" (click)="logout()">Logout</button>
    </div>
  </section>
</div>
